server {
  listen 5173;
  root /usr/share/nginx/html;

  # On every response, errors included. A location that sets its own add_header stops inheriting these, so
  # one that needs a header repeats this block. Scripts, styles and fonts (@fontsource, KaTeX) are bundled; Vite
  # inlines the smallest KaTeX font as a data URL. Styles allow inline because CopilotKit, Streamdown and Shiki
  # set style attributes. img-src keeps a model-written image from another origin unfetched, and connect-src
  # blocks every call but the same-origin /api.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  # Docker's DNS, re-read every 10 s: a recreated bff container gets a new address, and a name resolved
  # once at startup would keep proxying to the old one (502 until web restarts).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $bff_upstream http://bff:3000;

  # Same-origin proxy to the BFF; buffering off so SSE tokens reach the browser as they stream.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $bff_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
