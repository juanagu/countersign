[project]
name = "bot"
version = "0.1.0"
description = "Banking assistant bot: FastAPI + Pydantic AI over AG-UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.6",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic-ai-slim[ag-ui,anthropic,mcp]>=2.68",
    "pydantic-settings>=2.12",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.95.0",
    "fastmcp-slim[server]>=4.1.8",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are what tests are made of

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = ["app/contracts/generated/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
