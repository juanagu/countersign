packages:
  - apps/*
  - services/mcp-*
  - packages/*

allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  protobufjs: false

# Patched versions for advisories in CopilotKit's transitive tree (backlog F55), so the weekly
# `pnpm audit --prod` stays green. Drop each once a CopilotKit upgrade pulls the fix in itself.
overrides:
  'undici@<6.29.1': ^6.29.1
  'graphql-scalars@<2.0.1': ^2.0.1
  # Keeps every zod 4 copy patched, so the ignore below can only ever cover the zod 3 one.
  'zod@>=4.0.0 <4.6.6': ^4.6.7

# Accepted, not patched: zod 3's memory-exhaustion advisory. CopilotKit's A2UI renderer (@a2ui/web_core
# 0.15) needs zod 3 internals and no patched zod 3 exists; ADR 019 has the reasoning and the exit.
auditConfig:
  ignoreGhsas:
    - GHSA-mrhx-c7xc-m3w5
